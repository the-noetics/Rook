name: Publish After the Tone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page and real still
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "$url" -o /tmp/after-the-tone.html
          grep -Fq '<title>After the Tone</title>' /tmp/after-the-tone.html
          curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${url%/}/stills/provenance-ending.png" -o /tmp/after-the-tone.png
          file /tmp/after-the-tone.png | grep -q 'PNG image data'
          echo "Live site and screenshot are publicly readable."
